<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>클릭러 게임</title>
    <style>
        body { font-family: sans-serif; background: #34495e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #click-btn { width: 180px; height: 180px; font-size: 2rem; background: #e74c3c; color: #fff; border: none; border-radius: 50%; cursor: pointer; box-shadow: 0 8px #c0392b; transition: 0.05s; }
        #click-btn:active { transform: translateY(4px); box-shadow: 0 4px #c0392b; }
        #score { font-size: 3rem; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔥 쿠키 클릭러</h1>
    <div id="score">0</div>
    <button id="click-btn" onclick="clickCount()">클릭!</button>
    <script>
        let score = 0;
        function clickCount() {
            score++;
            document.getElementById('score').textContent = score;
        }
    </script>
</body>
</html>
