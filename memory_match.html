<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기억력 카드 게임</title>
    <style>
        body { font-family: sans-serif; background: #27ae60; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; }
        .card { width: 70px; height: 70px; background: #2c3e50; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; }
        .card.open { background: #fff; color: #000; }
    </style>
</head>
<body>
    <h1>🧠 기억력 카드 맞추기</h1>
    <div class="grid" id="grid"></div>
    <script>
        const emojis = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍉', '🍉'];
        emojis.sort(() => Math.random() - 0.5);
        const grid = document.getElementById('grid');
        let first = null, lock = false;
        emojis.forEach((emoji, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.val = emoji;
            card.onclick = () => {
                if(lock || card.classList.contains('open') || card.classList.contains('matched')) return;
                card.textContent = emoji;
                card.classList.add('open');
                if(!first) { first = card; }
                else {
                    if(first.dataset.val === card.dataset.val) {
                        first.classList.add('matched'); card.classList.add('matched');
                        first = null;
                    } else {
                        lock = true;
                        setTimeout(() => {
                            first.classList.remove('open'); first.textContent = '';
                            card.classList.remove('open'); card.textContent = '';
                            first = null; lock = false;
                        }, 800);
                    }
                }
            };
            grid.appendChild(card);
        });
    </script>
</body>
</html>
