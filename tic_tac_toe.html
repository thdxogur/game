<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>틱택토 게임</title>
    <style>
        body { font-family: sans-serif; background: #1e3c72; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; }
        .cell { background: rgba(255,255,255,0.2); border: none; border-radius: 8px; font-size: 2.5rem; color: #fff; cursor: pointer; height: 100px; }
        #reset-btn { margin-top: 20px; padding: 10px 20px; background: #ffcc00; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>틱택토 게임</h1>
    <div id="status" style="margin-bottom:15px;">플레이어 X 차례</div>
    <div class="board" id="board">
        <button class="cell" onclick="play(0)"></button><button class="cell" onclick="play(1)"></button><button class="cell" onclick="play(2)"></button>
        <button class="cell" onclick="play(3)"></button><button class="cell" onclick="play(4)"></button><button class="cell" onclick="play(5)"></button>
        <button class="cell" onclick="play(6)"></button><button class="cell" onclick="play(7)"></button><button class="cell" onclick="play(8)"></button>
    </div>
    <button id="reset-btn" onclick="reset()">다시 하기</button>
    <script>
        let board = ['', '', '', '', '', '', '', '', ''], turn = 'X', active = true;
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        function play(i) {
            if(!active || board[i]) return;
            board[i] = turn;
            document.querySelectorAll('.cell')[i].textContent = turn;
            for(let w of wins) {
                if(board[w[0]] && board[w[0]] === board[w[1]] && board[w[1]] === board[w[2]]) {
                    document.getElementById('status').textContent = `플레이어 ${turn} 승리!`;
                    active = false; return;
                }
            }
            if(!board.includes('')) { document.getElementById('status').textContent = `무승부!`; active = false; return; }
            turn = turn === 'X' ? 'O' : 'X';
            document.getElementById('status').textContent = `플레이어 ${turn} 차례`;
        }
        function reset() {
            board = ['', '', '', '', '', '', '', '', '']; turn = 'X'; active = true;
            document.querySelectorAll('.cell').forEach(c => c.textContent = '');
            document.getElementById('status').textContent = `플레이어 X 차례`;
        }
    </script>
</body>
</html>
